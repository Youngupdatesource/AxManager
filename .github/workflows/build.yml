name: Build AxM-Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :manager:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: AxM-Next-apk
          path: manager/build/outputs/apk/**/*.apk
